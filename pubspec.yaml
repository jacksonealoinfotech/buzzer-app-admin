name: flutter_base_template
description: "Production-grade, reusable Flutter Clean Architecture Base Template"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Concurrency
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  hydrated_bloc: ^11.0.0

  # Data Immutability & Annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Dependency Injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Networking & HTTP
  dio: ^5.11.1

  # Navigation & Routing
  go_router: ^18.0.2

  # Local Database (SQLite)
  sqflite: ^2.4.2
  path: ^1.9.1

  # Local Storage & Utilities
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8

  # Logging & Diagnostics
  talker: ^5.1.20
  talker_flutter: ^5.1.20
  google_fonts: ^9.0.0

  # ---------------------------------------------------------------------------
  # OPTIONAL PACKAGES (Uncomment as needed when enabling features)
  # ---------------------------------------------------------------------------
  # Firebase Core & Cloud Messaging
  # firebase_core: ^3.12.0
  # firebase_messaging: ^15.2.0
  # firebase_analytics: ^11.4.0
  # firebase_crashlytics: ^4.3.0
  # firebase_remote_config: ^5.3.0
  #
  # Local Notifications & Timezones
  # flutter_local_notifications: ^18.0.1
  # timezone: ^0.10.0
  #
  # Hardware-backed Secure Storage (iOS Keychain / Android Keystore)
  # flutter_secure_storage: ^9.2.4
  #
  # Image Caching
  # cached_network_image: ^3.4.1
  #
  # Animations & Motion
  # animations: ^2.0.11
  # flutter_animate: ^4.5.2
  # lottie: ^3.3.1
  # rive: ^0.13.20
  #
  # Hardware & Permissions
  # permission_handler: ^11.4.0
  # local_auth: ^2.3.0
  #
  # Dynamic Color (Material You Android 12+)
  # dynamic_color: ^1.7.0
  #
  # Typography & Fonts
  # google_fonts: ^6.2.1
  #
  # Sentry Crash Reporting
  # sentry_flutter: ^8.14.0
  #
  # Retrofit HTTP Client
  # retrofit: ^4.4.2
  #
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  injectable_generator: ^3.1.3
  go_router_builder: ^4.5.0

  # Testing & Mocks
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.3.6

  # Linting & Analysis
  flutter_lints: ^6.0.0
  very_good_analysis: ^11.0.0

  # ---------------------------------------------------------------------------
  # OPTIONAL DEV PACKAGES (Uncomment when corresponding tools are used)
  # ---------------------------------------------------------------------------
  # flutter_gen_runner: ^5.10.0
  # envied_generator: ^1.1.1
  # retrofit_generator: ^9.1.9

flutter:
  uses-material-design: true
  generate: true
